<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimento</title>

</head>
<body>
    <header>
        <h1>Simulador de Investimento</h1>
        <p>Compare o Rendimento da Poupança com a Taxa Selic</p>
    </header>
    <div class="container">
        <label for="valor">Valor do Investimento (R$):</label>
        <input type="number" id="valor" placeholder="Ex:1000">

        <label for="periodo">Período (meses):</label>
        <input type="number" id="perido" placeholder= "Ex:12">

        <button onclick="simularInvestimento()">Simular</button>

<div class="resultado" id="resultado"></div>
  </div>
  
</body>
</html>
